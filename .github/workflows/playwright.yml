name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * *" # Roda todo dia às 02:00 BRT (05:00 UTC)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      MS_EMAIL: ${{ secrets.MS_EMAIL }}
      MS_SENHA: ${{ secrets.MS_SENHA }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test --reporter=html

      - name: Generate PDF Report
        if: always()
        run: node generate-pdf.js

      - name: Send Test Report Email with PDF Attachment
        uses: dawidd6/action-send-mail@v6
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_RELATORIO }}
          password: ${{ secrets.SENHA_RELATORIO }}
          to: ${{ secrets.REPORT_RECIPIENT }}
          from: GitHub Actions Test Report <${{ secrets.EMAIL_RELATORIO }}>
          subject: |
            ${{ job.status == 'success' && '✅ SUCESSO' || '🚨 FALHA' }} | Playwright Tests | Relatório PDF
          body: |
            Olá, Os testes de Playwright foram concluídos com status: ${{ job.status }}. 
            O relatório visual dos testes está ANEXADO neste email como **report.pdf**. 
            Pipeline: ${{ github.workflow }} Branch: ${{ github.ref_name }} Para ver o log completo do pipeline, 
            clique no link abaixo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: report.pdf
