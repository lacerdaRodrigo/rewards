name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * *"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      # -----------------------------------------------
      # ETAPA NOVA 1: COMPACTAR O RELATÓRIO HTML
      # -----------------------------------------------
      - name: Zip Playwright HTML Report
        uses: actions/zip@v1
        if: always() # Compacta o relatório mesmo em caso de falha
        with:
          files: playwright-report/
          dest: playwright-report.zip

      # -----------------------------------------------
      # ETAPA NOVA 2: ENVIO DE E-MAIL COM ANEXO
      # -----------------------------------------------
      - name: Send Test Report Email with Attachment
        uses: dawidd6/action-send-mail@v6
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          to: ${{ secrets.REPORT_RECIPIENT }}
          from: GitHub Actions Test Report <${{ secrets.EMAIL_USERNAME }}>

          subject: |
            ${{ job.status == 'success' && '✅ SUCESSO' || '🚨 FALHA' }} | Playwright Tests | ${{ github.ref_name }}

          body: |
            Olá,

            Os testes de Playwright foram concluídos com status: ${{ job.status }}.

            O relatório HTML completo está anexado neste email. Para visualizar, faça o download do arquivo ZIP, descompacte-o e abra o arquivo 'index.html' no seu navegador.

            Pipeline: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Ver log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Configuração do Anexo
          attachments: playwright-report.zip
