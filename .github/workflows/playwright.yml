name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * *" # Roda todo dia às 02:00 BRT (05:00 UTC)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Variáveis de ambiente para seus testes
      MS_EMAIL: ${{ secrets.MS_EMAIL }}
      MS_SENHA: ${{ secrets.MS_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        # Esta etapa gera a pasta 'playwright-report/'
        run: npx playwright test

      # -----------------------------------------------
      # 1. COMPACTAR O RELATÓRIO HTML (FIXED)
      # Usando uma Action funcional (Themour/zip-dir)
      # -----------------------------------------------
      - name: Zip Playwright HTML Report
        uses: Themour/zip-dir@v1
        if: always() # Garante que o zip seja criado mesmo se o teste falhar
        with:
          # Pasta a ser compactada
          directory: playwright-report
          # Nome do arquivo de saída
          output_name: playwright-report.zip

      # -----------------------------------------------
      # 2. ENVIO DE E-MAIL COM ANEXO
      # -----------------------------------------------
      - name: Send Test Report Email with Attachment
        uses: dawidd6/action-send-mail@v6
        if: always() # Garante que esta etapa sempre seja executada
        with:
          # Configurações do Servidor SMTP (Gmail)
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Credenciais de autenticação (usando seus Secrets customizados)
          username: ${{ secrets.EMAIL_RELATORIO }}
          password: ${{ secrets.SENHA_RELATORIO }}

          # Destinatário e Remetente
          to: ${{ secrets.REPORT_RECIPIENT }}
          from: GitHub Actions Test Report <${{ secrets.EMAIL_RELATORIO }}>

          # Assunto do Email (indica Sucesso ou Falha)
          subject: |
            ${{ job.status == 'success' && '✅ SUCESSO' || '🚨 FALHA' }} | Playwright Tests | ${{ github.ref_name }}

          # Corpo do Email
          body: |
            Olá,

            Os testes de Playwright foram concluídos com status: ${{ job.status }}.

            O relatório HTML completo está ANEXADO neste email como **playwright-report.zip**. Para visualizar o relatório bonito e interativo, baixe o arquivo ZIP, descompacte-o e abra o arquivo 'index.html' no seu navegador.

            Pipeline: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Commit SHA: ${{ github.sha }}

            Para ver o log completo do pipeline, clique no link abaixo:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Configuração que ANEXA o arquivo ZIP
          attachments: playwright-report.zip
