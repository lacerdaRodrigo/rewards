name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * *" # Roda todo dia às 02:00 BRT (05:00 UTC)

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Variáveis de ambiente para seus testes
      MS_EMAIL: ${{ secrets.MS_EMAIL }}
      MS_SENHA: ${{ secrets.MS_SENHA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        # Instala SOMENTE o Chromium (Base do Chrome)
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        # Esta etapa gera a pasta 'playwright-report/'
        run: npx playwright test

      # -----------------------------------------------
      # 1. CONVERTER RELATÓRIO HTML PARA PDF
      # Usa o próprio Playwright, com comando simplificado para evitar erros.
      # -----------------------------------------------
      - name: Convert HTML Report to PDF
        if: always() # Garante que rode mesmo se o teste falhar
        run: |
          # Instala Playwright globalmente para usar o binário CLI
          npm install -g playwright

          # Comando corrigido: Converte o index.html em report.pdf sem argumentos de formato
          npx playwright pdf playwright-report/index.html report.pdf --timeout 60000
        shell: bash

      # -----------------------------------------------
      # 2. ENVIO DE E-MAIL COM ANEXO PDF
      # -----------------------------------------------
      - name: Send Test Report Email with Attachment
        uses: dawidd6/action-send-mail@v6
        if: always() # Garante que esta etapa sempre seja executada
        with:
          # Configurações do Servidor SMTP (Gmail)
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          # Credenciais de autenticação (usando seus Secrets customizados)
          username: ${{ secrets.EMAIL_RELATORIO }}
          password: ${{ secrets.SENHA_RELATORIO }}

          # Destinatário e Remetente
          to: ${{ secrets.REPORT_RECIPIENT }}
          from: GitHub Actions Test Report <${{ secrets.EMAIL_RELATORIO }}>

          # Assunto do Email (indica Sucesso ou Falha)
          subject: |
            ${{ job.status == 'success' && '✅ SUCESSO' || '🚨 FALHA' }} | Playwright Tests | Relatório PDF

          # Corpo do Email
          body: |
            Olá,

            Os testes de Playwright foram concluídos com status: ${{ job.status }}.

            O relatório visual dos testes está ANEXADO neste email como **report.pdf**. Você pode abri-lo facilmente no seu celular ou desktop.

            Pipeline: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}

            Para ver o log completo do pipeline, clique no link abaixo:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          # Configuração que ANEXA o arquivo PDF
          attachments: report.pdf
